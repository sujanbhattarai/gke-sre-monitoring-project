
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-gke-deployer
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-gke-deployer-binding
  namespace: default
subjects:
  - kind: User
    name: github-gke-deployer@project-918e19aa-5e72-4ef1-a47.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: github-gke-deployer
  apiGroup: rbac.authorization.k8s.io
