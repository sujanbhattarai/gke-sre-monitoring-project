name: GKE SRE CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: project-918e19aa-5e72-4ef1-a47
  REGION: us-east4
  CLUSTER_NAME: cluster1
  REGISTRY: us-east4-docker.pkg.dev
  REPOSITORY: sre-docker-repo
  IMAGE_NAME: sre-demo-app
  NAMESPACE: default

jobs:
  validate:
    name: Validate Kubernetes YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YAML validator
        run: pip install yamllint

      - name: Validate Kubernetes YAML
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" kubernetes/

  deploy:
    name: Build and Deploy to GKE
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: gke-production-deployment
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/950882012358/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-gke-deployer@project-918e19aa-5e72-4ef1-a47.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Build Docker image
        run: |
          IMAGE_URI="$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$GITHUB_SHA"
          docker build -t "$IMAGE_URI" -f app/app/Dockerfile app/
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Push Docker image
        run: |
          docker push "$IMAGE_URI"

      - name: Install GKE authentication plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Connect to GKE
        run: |
          gcloud container clusters get-credentials "$CLUSTER_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID"

      - name: Deploy application
        run: |
          kubectl set image deployment/sre-demo-app \
            nginx="$IMAGE_URI" \
            -n "$NAMESPACE"

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/sre-demo-app \
            -n "$NAMESPACE" --timeout=300s
          kubectl get pods -n "$NAMESPACE" -l app=sre-demo-app

      - name: Verify application health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 10 --max-time 15 \
            http://136.82.221.246 -o /tmp/application.html
          grep -q "GKE SRE Monitoring Project" /tmp/application.html
          echo "Application health verification successful"
